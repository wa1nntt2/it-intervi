global:
  scrape_interval: 15s      # Как часто опрашивать targets
  evaluation_interval: 15s  # Как часто проверять правила алертов

# Правила алертов (пока пустые, добавим позже)
rule_files:
  # - "alerts.yml"

# Цели для сбора метрик
scrape_configs:
  # Сам Prometheus (мониторим его тоже)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Наш backend (FastAPI)
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics