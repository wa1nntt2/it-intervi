[pytest]
# Пути к тестам
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Настройки asyncio
asyncio_mode = auto

# Покрытие кода
addopts = 
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    -v
    --tb=short

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Маркеры тестов
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    security: Security tests
