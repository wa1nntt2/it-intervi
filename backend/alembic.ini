# Alembic конфигурация для управления миграциями БД

[alembic]
# Путь к директории с миграциями
script_location = alembic

# Предупреждать о множественных головах (heads)
prepend_sys_path = .

# URL подключения к базе данных
# Переопределяется через переменную окружения или в alembic/env.py
sqlalchemy.url = sqlite:///./interview_trainer.db

# Template для создания новых миграций
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Кодировка файлов миграций
output_encoding = utf-8

# Максимальная длина идентификатора (для совместимости с разными БД)
# truncate_slug_length = 40

# Путь к файлу логгирования (опционально)
# fileConfig = logging.conf

[post_write_hooks]
# Хуки для форматирования кода после создания миграции
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
