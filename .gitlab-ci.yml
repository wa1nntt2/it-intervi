# GitLab CI/CD Pipeline для IT Interview Trainer
# Fullstack приложение: FastAPI backend + React frontend

stages:
  - test
  - build
  - security
  - deploy

# Переменные окружения для всего pipeline
variables:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  # GitLab Registry настройки
  DOCKER_REGISTRY: "$CI_REGISTRY"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# Кэширование для ускорения сборок
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pip-cache/
    - .npm-cache/
    - backend/venv/
    - frontend/node_modules/

# ============================================
# Backend Tests
# ============================================
backend-tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  tags:
    - docker
  before_script:
    - pip install --upgrade pip
    - pip install virtualenv
    - cd backend
    - virtualenv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
  script:
    # Запуск линтера
    - echo "🔍 Запуск flake8..."
    - flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # Запуск тестов
    - echo "🧪 Запуск pytest..."
    - pytest tests/ -v --tb=short --cov=app --cov-report=html --cov-report=xml
  artifacts:
    when: always
    paths:
      - backend/htmlcov/
      - backend/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week
  environment:
    name: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ============================================
# Frontend Tests & Build
# ============================================
frontend-tests:
  stage: test
  image: node:${NODE_VERSION}-alpine
  tags:
    - docker
  before_script:
    - cd frontend
    - npm ci --cache .npm-cache --prefer-offline
  script:
    # Линтинг
    - echo "🔍 Запуск ESLint..."
    - npm run lint || true
    # TypeScript проверка типов
    - echo "📝 Проверка типов TypeScript..."
    - npx tsc --noEmit
    # Сборка
    - echo "🏗️ Сборка frontend..."
    - npm run build
  artifacts:
    when: success
    paths:
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ============================================
# Docker Build
# ============================================
docker-build-backend:
  stage: build
  image: docker:24-dind
  tags:
    - docker
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🐳 Сборка Docker образа backend..."
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" ./backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        DOCKER_TLS_CERTDIR: "/certs"

docker-build-frontend:
  stage: build
  image: docker:24-dind
  tags:
    - docker
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🐳 Сборка Docker образа frontend..."
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" ./frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        DOCKER_TLS_CERTDIR: "/certs"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        DOCKER_TLS_CERTDIR: "/certs"

# ============================================
# Security Scan
# ============================================
security-scan-python:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  tags:
    - docker
  allow_failure: true
  before_script:
    - pip install safety bandit
  script:
    - echo "🔒 Сканирование Python зависимостей (safety)..."
    - safety check -r backend/requirements.txt || true
    - echo "🔒 Статический анализ кода (bandit)..."
    - bandit -r backend/app/ -f json -o bandit-report.json || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

security-scan-frontend:
  stage: security
  image: node:${NODE_VERSION}-alpine
  tags:
    - docker
  allow_failure: true
  before_script:
    - cd frontend
    - npm ci --cache .npm-cache --prefer-offline
  script:
    - echo "🔒 Аудит npm зависимостей..."
    - npm audit --audit-level=high --json > npm-audit-report.json || true
  artifacts:
    when: always
    paths:
      - frontend/npm-audit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# Deploy to Staging (только для main)
# ============================================
deploy-staging:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "🚀 Деплой на staging окружение..."
    - echo "Commit: $CI_COMMIT_SHORT_SHA"
    - echo "Backend image: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Frontend image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Здесь добавьте ваши команды деплоя
    # Пример для docker-compose:
    # - curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose
    # - chmod +x /usr/local/bin/docker-compose
    # - docker-compose -f docker-compose.staging.yml up -d
    - echo "✅ Деплой завершен (placeholder)"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
  needs:
    - backend-tests
    - frontend-tests
    - docker-build-backend
    - docker-build-frontend

# ============================================
# Deploy to Production (только теги)
# ============================================
deploy-production:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "🚀🚀 Деплой на production окружение..."
    - echo "Tag: $CI_COMMIT_TAG"
    - echo "Backend image: $BACKEND_IMAGE:$CI_COMMIT_TAG"
    - echo "Frontend image: $FRONTEND_IMAGE:$CI_COMMIT_TAG"
    # Здесь добавьте ваши команды деплоя на production
    - echo "✅ Production деплой завершен (placeholder)"
  environment:
    name: production
    url: https://example.com
  rules:
    - if: $CI_COMMIT_TAG
  when: manual
  needs:
    - backend-tests
    - frontend-tests
    - docker-build-backend
    - docker-build-frontend
