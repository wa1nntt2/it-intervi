version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: it-interview-postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=interview_trainer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_trainer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - it-interview-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: it-interview-pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    restart: unless-stopped
    networks:
      - it-interview-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: it-interview-postgres-data
  pgadmin_data:
    name: it-interview-pgadmin-data

networks:
  it-interview-network:
    external: true